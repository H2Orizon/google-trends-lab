services:
  db:
    image: postgres:18
    container_name: google_trends_db
    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
  app:
    build: .
    container_name: google_trends_app
    restart: always

    ports:
      - "8501:8501"

    env_file:
      - .env

    depends_on:
      - db

    environment:
      DOCKER_ENV: "true"

volumes:
  postgres_data:
